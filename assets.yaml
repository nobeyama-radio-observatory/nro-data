# 資産の台帳：データの保管
# 項目の定義はハブの assets/README.md を参照。
#   https://github.com/nobeyama-radio-observatory/nro-context/blob/main/assets/README.md
# 2026-11-18 に新しく作った（判断記録 0006）。40周年記念誌から AI が埋め、聞き取り（interviews/）で補った。
#
# 接続先、ネットワーク構成、アクセスの方式、ソフトウェアの構成部品と版など、制御と情報セキュリティの詳細は書かない。
# この台帳にない id の置き場所は、ハブの assets/README.md の資産の索引で引ける。
#
# 出典の略記
#   40周年記念誌：『野辺山宇宙電波観測所40周年記念誌』2022年2月（国立国会図書館 請求記号 MB12-M7）。p.N はそのページ。
#     書誌の詳細はハブの history/README.md の出典の略記。年次報告と食い違うときは年次報告を採る
#   聞き取りYYYY-MM-DD(-n) 問N：interviews/YYYY-MM-DD(-n).md の問N

- id: db-nrodb-nobeyama
  name: NRODB（野辺山）
  kind: 計算機
  status: 運用中
  introduced: 2013年度に運用を開始。2013年度の計算機の更新で観測所のデータ解析システムを廃止し、解析を三鷹の計算機で行うことになったため、データを渡す仕組みとして観測所の計算機グループがメーカーと開発した
  maintenance: {by: 所内, condition: NRODB からデータを取り出し、パイプラインを適用して電波アーカイブに登録する作業に、運用の業務としてそれなりに人手がかかる。完全な自動化が課題, effort: 中}
  renewal: 更新の予定はない。YATSUGATAKE が稼働し始めると、データの形式が変わり量も急に増えるので、既存のシステムを改修してディスクを増やすか、新しいシステムを作る必要がある
  owner_role: 計算機グループ
  maintainers: 1
  docs:
    - 観測者向け：観測データ（取得の方法の所在、データの量、占有期間） https://www.nro.nao.ac.jp/projects/45m/data/
    - 非公開（所在のみ）：取得の方法。計算機グループの計算機とネットワークのシステムのページ（ハブの policy/non-public.md）（2026-11-19 に確認）
  sources:
    - 導入、対象のデータ：40周年記念誌 p.57
    - 保守、担い手の数、更新の見込み、担当：聞き取り2026-11-18 問1、問3、問4
  note: 観測の利用者に生データ（ロギングとマージの後のデータ）を提供するもので、観測の利用者だけが取得できる。電波アーカイブとは役割が違い、一本にする予定はない（聞き取り2026-11-18 問2、問4）。対象は、2013年度からマージしたデータ、2015年度から SAM45 のロギングデータ。観測とマージが終わると野辺山の NRODB に保存する。2021年12月の時点でおよそ23万件。利用者は Web とコマンドラインで取得する

- id: db-nrodb-mitaka
  name: NRODB（三鷹）
  kind: 計算機
  depends_on: [db-nrodb-nobeyama]
  status: 運用中
  introduced: 2013年度（野辺山の NRODB と同時）
  maintenance: {by: 所内、メーカー, condition: 国立天文台の天文データセンターと外部の事業者の補助を受けている, effort: 中}
  renewal: 更新の予定はない。YATSUGATAKE が稼働し始めると、データの形式が変わり量も急に増えるので、既存のシステムを改修してディスクを増やすか、新しいシステムを作る必要がある
  owner_role: 計算機グループ
  maintainers: 1
  sources:
    - 40周年記念誌 p.57
    - 保守、担い手の数、更新の見込み、担当：聞き取り2026-11-18 問1、問3、問4
  note: 野辺山の NRODB のデータを週1回の保守のときに三鷹に送り、二か所で持つ。2011年の震災の停電の経験から、電力の管轄が違う拠点に置くほうが失われにくいと考えたため

- id: db-radio-archive
  name: 電波アーカイブ（Nobeyama-45m/ASTE Science Data Archive）
  kind: 計算機
  depends_on: [db-nrodb-nobeyama]
  status: 運用中
  introduced: 2016年度にアルマのコンピューティングチームが中心になって作り、2017年度に運用を開始。のちに ASTE のデータも対象にし、2021年度から CASA の形式のデータとパイプライン処理のデータも公開している
  maintenance: {by: 所内、メーカー, condition: 国立天文台の天文データセンターと外部の事業者の補助を受けている。NRODB からデータを取り出し、パイプラインを適用して登録する作業に、運用の業務としてそれなりに人手がかかる。完全な自動化が課題, effort: 中}
  renewal: 更新の予定はない。YATSUGATAKE が稼働し始めると、データの形式が変わり量も急に増えるので、既存のシステムを改修してディスクを増やすか、新しいシステムを作る必要がある
  owner_role: 計算機グループ
  maintainers: 1
  docs:
    - 入口 https://nobeyama-archive.nao.ac.jp/user/index.html
    - 観測データ（占有期間の後の公開） https://www.nro.nao.ac.jp/projects/45m/data/ （2026-11-19 に確認）
  sources:
    - 導入：40周年記念誌 p.57
    - 記念誌のアーカイブと同じものであること、中身：聞き取り2026-11-18 問2
    - 運用の体制、保守、担い手の数、更新の見込み、担当：聞き取り2026-11-18 問1、問3、問4
  note: >-
    運用は、天文データセンター、ASTE、野辺山宇宙電波観測所の合同。ロギングとマージの後の生データに加え、パイプラインで自動的に解析した後の FITS ファイルも登録している。
    利用者を NRODB とは別に管理し、公開したデータは誰でも、占有期間中のデータは所有者だけが取得できる（聞き取り2026-11-18 問1、問2、問4）
